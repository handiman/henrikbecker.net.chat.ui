name: Build & Release cv-chat

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
  
      - name: List built files
        run: ls -R dist/

      - name: Release dist to GitHub
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
